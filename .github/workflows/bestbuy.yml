name: Best Buy Pokémon Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Test notification
        run: |
          echo "Sending test notification..."

          curl -fsS --max-time 20 \
            -H "Title: Pokémon Monitor Test" \
            -H "Priority: high" \
            -H "Tags: pokemon,white_check_mark" \
            -d "GitHub Actions is working! Your Pokémon stock monitor is connected." \
            "https://ntfy.sh/joshpokemon6685563"

          echo "Test notification sent successfully!"

      - name: Check Best Buy SKUs
        env:
          SKUS: "6685563 6685559 6685573 6685562 6685565 6683819 6681540 6685568 6685560 6685567 6689677 6685570 6689674 6689678 6689673 6689672"

        run: |
          set -u

          echo "========================================"
          echo "BEST BUY POKÉMON STOCK SCAN"
          echo "========================================"

          for SKU in $SKUS; do

            echo ""
            echo "----------------------------------------"
            echo "Checking SKU: $SKU"

            URL="https://www.bestbuy.com/site/sku/$SKU.p"

            RESPONSE=$(curl --http1.1 \
              -L \
              -sS \
              --connect-timeout 10 \
              --max-time 45 \
              -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$URL" 2>/dev/null) || {

                echo "⚠️ Could not retrieve SKU $SKU"
                continue
            }

            LENGTH=${#RESPONSE}

            echo "Response received: $LENGTH characters"

            if [ "$LENGTH" -lt 1000 ]; then
              echo "⚠️ Response is unusually small."
              echo "Best Buy may have blocked the request."
              continue
            fi

            echo "Searching response for stock indicators..."

            if echo "$RESPONSE" | grep -qiE \
              '"shippingAvailability"|"pickupAvailability"|"available":true|"inStock":true|"Add to Cart"|"Shipping available"|"Pickup available"'; then

              echo "🚨 POSSIBLE IN-STOCK ITEM!"
              echo "SKU: $SKU"
              echo "URL: $URL"

              curl -fsS --max-time 20 \
                -H "Title: 🚨 Pokémon Restock Alert!" \
                -H "Priority: urgent" \
                -H "Tags: rotating_light,pokemon" \
                -d "BEST BUY RESTOCK POSSIBLE! SKU $SKU appears to be available. $URL" \
                "https://ntfy.sh/joshpokemon6685563"

            else

              echo "❌ No obvious stock indicator found."

            fi

          done

          echo ""
          echo "========================================"
          echo "BEST BUY SCAN FINISHED"
          echo "========================================"