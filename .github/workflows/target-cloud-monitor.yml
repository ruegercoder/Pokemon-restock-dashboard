name: Target Pokémon Cloud Monitor

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a TEST notification only"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: target-pokemon-cloud-monitor
  cancel-in-progress: false

jobs:

  test-alert:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Target monitor test notification
        run: |
          curl -fsS --max-time 20 \
            -H "Title: 🧪 Target Pokémon Monitor Test" \
            -H "Priority: high" \
            -H "Tags: test_tube,pokemon" \
            -H "Click: https://www.target.com/p/-/A-1010892076" \
            -d "Cloud monitoring and notifications are working. Tap to open the Target ETB page." \
            "https://ntfy.sh/joshpokemon6685563"

          echo "✅ Test notification sent"


  check-target:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Restore previous Target stock state
        uses: actions/cache/restore@v4
        with:
          path: .target-stock-state.json
          key: target-stock-state-${{ github.run_id }}
          restore-keys: |
            target-stock-state-


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium


      - name: Check Target Pokémon products
        run: |
          cat > check-target.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const STATE_FILE = ".target-stock-state.json";

          const PRODUCTS = [
            {
              id: "A-1010892076",
              name: "Elite Trainer Box",
              words: ["30th", "celebration", "elite trainer box"]
            },
            {
              id: "A-1010892070",
              name: "Knock Out Collection",
              words: ["30th", "celebration", "knock out"]
            },
            {
              id: "A-1010892078",
              name: "Tech Sticker Collection",
              words: ["30th", "celebration", "tech sticker"]
            },
            {
              id: "A-1010892065",
              name: "Greninja ex Box",
              words: ["30th", "celebration", "greninja"]
            },
            {
              id: "A-1010892068",
              name: "Sylveon ex Box",
              words: ["30th", "celebration", "sylveon"]
            },
            {
              id: "A-1010892067",
              name: "Poster Collection",
              words: ["30th", "celebration", "poster"]
            },
            {
              id: "A-1010892069",
              name: "Celebration Tin",
              words: ["30th", "celebration", "tin"]
            }
          ];

          const NTFY_TOPIC = "joshpokemon6685563";


          function loadState() {

            try {

              if (!fs.existsSync(STATE_FILE)) {
                console.log("No previous stock state found.");
                return {};
              }

              const state =
                JSON.parse(
                  fs.readFileSync(
                    STATE_FILE,
                    "utf8"
                  )
                );

              console.log(
                "✅ Previous stock state loaded."
              );

              return state;

            } catch (error) {

              console.log(
                "⚠️ Could not read previous state."
              );

              return {};
            }
          }


          function saveState(state) {

            fs.writeFileSync(
              STATE_FILE,
              JSON.stringify(
                state,
                null,
                2
              )
            );

            console.log(
              "✅ Stock state saved."
            );
          }


          async function sendNotification(product, url) {

            const response = await fetch(
              `https://ntfy.sh/${NTFY_TOPIC}`,
              {
                method: "POST",

                headers: {
                  "Title": "🚨 TARGET POKÉMON RESTOCK",
                  "Priority": "urgent",
                  "Tags": "rotating_light,pokemon",
                  "Click": url
                },

                body:
                  `${product.name} may be IN STOCK at Target!\n\n` +
                  `${product.id}\n\n` +
                  `Tap this notification to open Target.`
              }
            );

            console.log(
              `Notification sent for ${product.name}: ${response.status}`
            );
          }


          (async () => {

            console.log(
              "========================================"
            );

            console.log(
              "TARGET POKÉMON CLOUD MONITOR"
            );

            console.log(
              "========================================"
            );


            const stockState =
              loadState();


            const browser =
              await chromium.launch({
                headless: true
              });


            const context =
              await browser.newContext({

                userAgent:
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) " +
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) " +
                  "Version/18.0 Mobile/15E148 Safari/604.1",

                viewport: {
                  width: 390,
                  height: 844
                },

                locale: "en-US"
              });


            for (const product of PRODUCTS) {

              const page =
                await context.newPage();


              const url =
                `https://www.target.com/p/-/${product.id}`;


              console.log("");

              console.log(
                "----------------------------------------"
              );

              console.log(
                `Checking: ${product.name}`
              );

              console.log(
                `ID: ${product.id}`
              );

              console.log(url);


              try {

                const response =
                  await page.goto(
                    url,
                    {
                      waitUntil: "domcontentloaded",
                      timeout: 60000
                    }
                  );


                console.log(
                  `HTTP status: ${
                    response
                      ? response.status()
                      : "unknown"
                  }`
                );


                await page.waitForTimeout(7000);


                const title =
                  await page
                    .title()
                    .catch(() => "");


                const bodyText =
                  await page
                    .locator("body")
                    .innerText()
                    .catch(() => "");


                const lower =
                  bodyText.toLowerCase();


                console.log(
                  `Title: ${title}`
                );

                console.log(
                  `Page text length: ${bodyText.length}`
                );


                // ==========================================
                // BLOCK / ERROR PAGE SAFETY CHECK
                // ==========================================

                const blockedWords = [
                  "access denied",
                  "verify you are human",
                  "captcha",
                  "automated access",
                  "something went wrong"
                ];


                const blocked =
                  blockedWords.some(
                    word =>
                      lower.includes(word)
                  );


                if (blocked) {

                  console.log(
                    "⚠️ Target returned a blocked/error page."
                  );

                  console.log(
                    "State was NOT changed."
                  );

                  await page.close();

                  continue;
                }


                // ==========================================
                // VERIFY CORRECT PRODUCT
                // ==========================================

                const productVerified =
                  product.words.every(
                    word =>
                      lower.includes(
                        word.toLowerCase()
                      )
                  );


                if (!productVerified) {

                  console.log(
                    "🔒 Product verification failed."
                  );

                  console.log(
                    "State was NOT changed."
                  );

                  await page.close();

                  continue;
                }


                console.log(
                  "✅ Product identity verified."
                );


                // ==========================================
                // FIND VALID PURCHASE BUTTON
                // ==========================================

                const buttons =
                  await page
                    .locator("button")
                    .all();


                let validAddButton =
                  false;


                for (const button of buttons) {

                  try {

                    if (
                      !(await button.isVisible())
                    ) {
                      continue;
                    }


                    if (
                      !(await button.isEnabled())
                    ) {
                      continue;
                    }


                    const text =
                      (
                        await button
                          .innerText()
                          .catch(() => "")
                      )
                        .trim()
                        .toLowerCase();


                    if (
                      text === "add to cart" ||
                      text.includes("ship it") ||
                      text.includes("shipping")
                    ) {

                      const box =
                        await button.boundingBox();


                      if (
                        box &&
                        box.y < 1800
                      ) {

                        validAddButton =
                          true;


                        console.log(
                          `🟢 PURCHASE BUTTON FOUND: ${text}`
                        );

                        break;
                      }
                    }

                  } catch (_) {}
                }


                // ==========================================
                // STOCK STATE + DEDUPLICATION
                // ==========================================

                const wasAvailable =
                  stockState[product.id] === true;


                if (validAddButton) {

                  console.log(
                    `🚨 AVAILABLE: ${product.name}`
                  );


                  if (!wasAvailable) {

                    console.log(
                      "🔔 NEW restock detected — sending notification."
                    );


                    await sendNotification(
                      product,
                      page.url()
                    );


                  } else {

                    console.log(
                      "🔕 Already alerted for this restock — no duplicate notification."
                    );
                  }


                  stockState[product.id] =
                    true;


                } else {

                  console.log(
                    `🟡 SOLD OUT / NO PURCHASE BUTTON: ${product.name}`
                  );


                  if (wasAvailable) {

                    console.log(
                      "♻️ Product returned to sold out."
                    );

                    console.log(
                      "Next restock will alert again."
                    );
                  }


                  stockState[product.id] =
                    false;
                }


              } catch (error) {

                console.log(
                  `⚠️ Could not check ${product.name}`
                );

                console.log(
                  error.message
                );

                console.log(
                  "State was NOT changed."
                );
              }


              await page.close();


              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    2000
                  )
              );
            }


            await browser.close();


            saveState(
              stockState
            );


            console.log("");

            console.log(
              "========================================"
            );

            console.log(
              "TARGET SCAN COMPLETE"
            );

            console.log(
              "========================================"
            );


          })().catch(error => {

            console.error(error);

            process.exit(1);
          });

          EOF

          node check-target.js


      - name: Save Target stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .target-stock-state.json
          key: target-stock-state-${{ github.run_id }}