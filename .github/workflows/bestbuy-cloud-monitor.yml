name: Best Buy Pokémon Cloud Monitor

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a TEST notification only"
        required: false
        default: false
        type: boolean
      simulate_restock:
        description: "SIMULATE a Best Buy restock for dedupe testing"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bestbuy-pokemon-cloud-monitor
  cancel-in-progress: false

jobs:
  test-alert:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && !inputs.simulate_restock }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Best Buy monitor test notification
        run: |
          curl -fsS --max-time 20 \
            -H "Title: Best Buy Pokemon Monitor Test" \
            -H "Priority: high" \
            -H "Tags: test_tube,pokemon" \
            -H "Click: https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254" \
            -d "Best Buy cloud monitoring and notifications are working. Tap to open the product page." \
            "https://ntfy.sh/joshpokemon6685563"
          echo "✅ Test notification sent"

  simulate-restock:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_restock }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore Best Buy dedupe test state
        uses: actions/cache/restore@v4
        with:
          path: .bestbuy-dedupe-state.json
          key: bestbuy-dedupe-state-${{ github.run_id }}
          restore-keys: |
            bestbuy-dedupe-state-

      - name: Simulate Best Buy restock
        run: |
          node <<'EOF'
          const fs = require("fs");

          const STATE_FILE = ".bestbuy-dedupe-state.json";
          const NTFY_TOPIC = "joshpokemon6685563";
          const PRODUCT = {
            name: "Pokémon TCG 30th Celebration Ultra-Premium Collection",
            sku: "6685563",
            url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254"
          };

          function loadState() {
            try {
              if (!fs.existsSync(STATE_FILE)) return {};
              return JSON.parse(fs.readFileSync(STATE_FILE, "utf8"));
            } catch (_) {
              return {};
            }
          }

          async function sendNotification() {
            const response = await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
              method: "POST",
              headers: {
                "Title": "SIMULATED BEST BUY RESTOCK",
                "Priority": "urgent",
                "Tags": "test_tube,pokemon",
                "Click": PRODUCT.url
              },
              body:
                `SIMULATION ONLY\n\n` +
                `${PRODUCT.name}\n\n` +
                `SKU ${PRODUCT.sku}`
            });

            if (!response.ok) {
              throw new Error(`Notification failed: ${response.status}`);
            }
          }

          (async () => {
            const state = loadState();
            const wasAvailable = state[PRODUCT.sku] === true;

            if (!wasAvailable) {
              console.log("🔔 First simulated restock.");
              await sendNotification();
              state[PRODUCT.sku] = true;
              console.log("✅ FIRST SIMULATED RESTOCK RECORDED");
            } else {
              console.log("🔕 Duplicate notification suppressed.");
              console.log("✅ DEDUPE TEST PASSED");
            }

            fs.writeFileSync(
              STATE_FILE,
              JSON.stringify(state, null, 2)
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Save Best Buy dedupe test state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bestbuy-dedupe-state.json
          key: bestbuy-dedupe-state-${{ github.run_id }}

  check-bestbuy:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_alert && !inputs.simulate_restock) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous Best Buy stock state
        uses: actions/cache/restore@v4
        with:
          path: .bestbuy-stock-state.json
          key: bestbuy-stock-state-${{ github.run_id }}
          restore-keys: |
            bestbuy-stock-state-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Best Buy Pokémon multi-product watch
        run: |
          cat > check-bestbuy.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const STATE_FILE = ".bestbuy-stock-state.json";
          const NTFY_TOPIC = "joshpokemon6685563";
          const WORKERS = 2;
          const RENDER_WAIT_MS = 4000;

          const PRODUCTS = [
            {
              name: "30th Celebration Ultra-Premium Collection",
              sku: "6685563",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254",
              requiredWords: ["30th celebration", "ultra-premium collection", "6685563"]
            },
            {
              name: "Mega Evolution Delta Reign Elite Trainer Box",
              sku: "6689672",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-mega-evolution-delta-reign-elite-trainer-box/JJG2TL8QGY",
              requiredWords: ["delta reign", "elite trainer box", "6689672"]
            },
            {
              name: "Mega Evolution Delta Reign 3-Pack Booster",
              sku: "6689673",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-mega-evolution-delta-reign-3pk-booster/JJG2TL8QL3",
              requiredWords: ["delta reign", "3", "6689673"]
            },
            {
              name: "Mega Evolution Delta Reign Booster Bundle",
              sku: "6689678",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-mega-evolution-delta-reign-booster-bundle/JJG2TL8QGF",
              requiredWords: ["delta reign", "booster bundle", "6689678"]
            },
            {
              name: "Mega Evolution Delta Reign Sleeved Booster",
              sku: "6689674",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-mega-evolution-delta-reign-sleeved-booster-1-sleeved-booster-per-order-styles-may-vary/JJG2TL33Z3",
              requiredWords: ["delta reign", "sleeved booster", "6689674"]
            },
            {
              name: "30th Celebration Elite Trainer Box",
              sku: "6685559",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-elite-trainer-box/JJG2TL8XCJ",
              requiredWords: ["30th celebration", "elite trainer box", "6685559"]
            },
            {
              name: "30th Celebration Knock Out Collection",
              sku: "6685567",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-knock-out-collection/JJG2TL3WZ5",
              requiredWords: ["30th celebration", "knock out collection", "6685567"]
            },
            {
              name: "30th Celebration Poster Collection",
              sku: "6685565",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-poster-collection/JJG2TL8X7G/sku/6685565",
              requiredWords: ["30th celebration", "poster collection", "6685565"]
            },
            {
              name: "30th Celebration Sylveon ex / Greninja ex Box",
              sku: "6685560",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-sylveon-ex-box-or-greninja-ex-box-1-ex-box-per-order-styles-may-vary/JJG2TL82VJ/sku/6685560",
              requiredWords: ["30th celebration", "sylveon", "6685560"]
            },
            {
              name: "30th Celebration Figure Collection Mew / Mewtwo",
              sku: "6685564",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-figure-collection-mew-or-mewto-1-figure-collection-per-order-styles-may-vary/JJG2TL8XX8/sku/6685564",
              requiredWords: ["30th celebration", "figure collection", "6685564"]
            },
            {
              name: "30th Celebration Tech Sticker Collection",
              sku: "6685574",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-tech-sticker-collection-1-tech-sticker-collection-per-order-styles-may-vary/JJG2TL8X74/sku/6685574",
              requiredWords: ["30th celebration", "tech sticker collection", "6685574"]
            },
            {
              name: "30th Celebration Ditto Premium Collection",
              sku: "6685562",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ditto-premium-collection/JJG2TL82YW/sku/6685562",
              requiredWords: ["30th celebration", "ditto premium collection", "6685562"]
            },
            {
              name: "30th Celebration Mini Tin",
              sku: "6685572",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-mini-tin-1-mini-tin-per-order-styles-may-vary/JJG2TL8X6V/sku/6685572",
              requiredWords: ["30th celebration", "mini tin", "6685572"]
            },
            {
              name: "30th Celebration Binder Collection",
              sku: "6685568",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-binder-collection/JJG2TL8245/sku/6685568",
              requiredWords: ["30th celebration", "binder collection", "6685568"]
            },
            {
              name: "30th Celebration Tin",
              sku: "6685561",
              url: "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-tin-1-tin-per-order-styles-may-vary/JJG2TL3Y7Y/sku/6685561",
              requiredWords: ["30th celebration", "tin", "6685561"]
            }
          ];

          function loadState() {
            try {
              if (!fs.existsSync(STATE_FILE)) {
                console.log("No previous Best Buy stock state found.");
                return {};
              }

              const state = JSON.parse(fs.readFileSync(STATE_FILE, "utf8"));
              console.log("✅ Previous Best Buy stock state loaded.");
              return state;
            } catch (_) {
              console.log("⚠️ Could not read previous Best Buy stock state.");
              return {};
            }
          }

          function saveState(state) {
            fs.writeFileSync(
              STATE_FILE,
              JSON.stringify(state, null, 2)
            );
          }

          async function sendNotification(product) {
            const response = await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
              method: "POST",
              headers: {
                "Title": "BEST BUY POKEMON RESTOCK",
                "Priority": "urgent",
                "Tags": "rotating_light,pokemon",
                "Click": product.url
              },
              body:
                `${product.name} may be available at Best Buy!\n\n` +
                `SKU ${product.sku}\n\n` +
                `Tap this notification to open Best Buy.`
            });

            console.log(`[${product.sku}] Notification status: ${response.status}`);

            if (!response.ok) {
              throw new Error(
                `[${product.sku}] Notification failed with HTTP ${response.status}`
              );
            }
          }

          async function inspectProduct(page, product) {
            console.log("");
            console.log("====================================================");
            console.log(`CHECKING: ${product.name}`);
            console.log(`SKU: ${product.sku}`);
            console.log("====================================================");

            let response;

            try {
              response = await page.goto(product.url, {
                waitUntil: "domcontentloaded",
                timeout: 45000
              });
            } catch (error) {
              console.log(`[${product.sku}] ⚠️ Navigation failed. State unchanged.`);
              return { trusted: false, available: null };
            }

            console.log(
              `[${product.sku}] HTTP status: ${response ? response.status() : "unknown"}`
            );

            await page.waitForTimeout(RENDER_WAIT_MS);

            const bodyText = await page
              .locator("body")
              .innerText()
              .catch(() => "");

            const lower = bodyText.toLowerCase();

            const blockedWords = [
              "access denied",
              "verify you are human",
              "captcha",
              "automated access",
              "robot",
              "unusual traffic"
            ];

            if (blockedWords.some(word => lower.includes(word))) {
              console.log(
                `[${product.sku}] ⚠️ Best Buy returned a blocked/challenge page. State unchanged.`
              );
              return { trusted: false, available: null };
            }

            const productVerified = product.requiredWords.every(word =>
              lower.includes(word.toLowerCase())
            );

            if (!productVerified) {
              console.log(
                `[${product.sku}] 🔒 Product identity verification failed. State unchanged.`
              );
              return { trusted: false, available: null };
            }

            console.log(`[${product.sku}] ✅ Product identity verified.`);

            const comingSoon = lower.includes("coming soon");

            const buttons = page.locator("button, [role='button']");
            const count = await buttons.count();
            const purchaseButtons = [];

            for (let i = 0; i < count; i++) {
              const button = buttons.nth(i);

              try {
                if (!(await button.isVisible())) continue;
                if (!(await button.isEnabled())) continue;

                const text = (await button.innerText().catch(() => ""))
                  .trim()
                  .replace(/\s+/g, " ")
                  .toLowerCase();

                const purchaseText =
                  text === "add to cart" ||
                  text === "pre-order" ||
                  text === "preorder";

                if (!purchaseText) continue;

                const box = await button.boundingBox();
                if (!box) continue;

                if (box.width < 250 || box.height < 35) continue;

                purchaseButtons.push(text);
              } catch (_) {}
            }

            console.log(`[${product.sku}] Coming Soon: ${comingSoon}`);
            console.log(
              `[${product.sku}] Large purchase controls: ${purchaseButtons.length}`
            );

            const available =
              !comingSoon &&
              purchaseButtons.length >= 1;

            return {
              trusted: true,
              available
            };
          }

          (async () => {
            console.log("========================================");
            console.log("BEST BUY POKÉMON MULTI-PRODUCT CLOUD WATCH");
            console.log(`PRODUCTS: ${PRODUCTS.length}`);
            console.log(`WORKERS: ${WORKERS}`);
            console.log("========================================");

            const stockState = loadState();

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) " +
                "Version/18.0 Mobile/15E148 Safari/604.1",
              viewport: {
                width: 390,
                height: 844
              },
              locale: "en-US"
            });

            let nextIndex = 0;

            async function worker(workerNumber) {
              const page = await context.newPage();

              try {
                while (true) {
                  const index = nextIndex++;
                  if (index >= PRODUCTS.length) break;

                  const product = PRODUCTS[index];

                  console.log(
                    `\nWorker ${workerNumber} -> ${product.sku} ${product.name}`
                  );

                  const result = await inspectProduct(page, product);

                  if (!result.trusted) {
                    continue;
                  }

                  const wasAvailable =
                    stockState[product.sku] === true;

                  if (result.available) {
                    console.log(
                      `[${product.sku}] 🚨 AVAILABLE: ${product.name}`
                    );

                    if (!wasAvailable) {
                      console.log(
                        `[${product.sku}] 🔔 New availability detected — sending notification.`
                      );
                      await sendNotification(product);
                    } else {
                      console.log(
                        `[${product.sku}] 🔕 Already alerted for this availability window.`
                      );
                    }

                    stockState[product.sku] = true;
                  } else {
                    console.log(
                      `[${product.sku}] 🟡 Not currently available.`
                    );
                    stockState[product.sku] = false;
                  }

                  saveState(stockState);
                }
              } finally {
                await page.close();
              }
            }

            try {
              await Promise.all(
                Array.from(
                  { length: WORKERS },
                  (_, i) => worker(i + 1)
                )
              );
            } finally {
              saveState(stockState);
              await browser.close();
            }

            console.log("========================================");
            console.log("✅ Best Buy multi-product watch finished.");
            console.log("========================================");
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node check-bestbuy.js

      - name: Save Best Buy stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bestbuy-stock-state.json
          key: bestbuy-stock-state-${{ github.run_id }}