name: Best Buy Pokémon Cloud Monitor

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a TEST notification only"
        required: false
        default: false
        type: boolean

      simulate_restock:
        description: "SIMULATE a Best Buy restock for dedupe testing"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bestbuy-pokemon-cloud-monitor
  cancel-in-progress: false

jobs:

  # ============================================================
  # TEST NOTIFICATION
  # ============================================================

  test-alert:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && !inputs.simulate_restock }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Best Buy monitor test notification
        run: |
          curl -fsS --max-time 20 \
            -H "Title: Best Buy Pokemon Monitor Test" \
            -H "Priority: high" \
            -H "Tags: test_tube,pokemon" \
            -H "Click: https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254" \
            -d "Best Buy cloud monitoring and notifications are working. Tap to open the product page." \
            "https://ntfy.sh/joshpokemon6685563"

          echo "✅ Test notification sent"


  # ============================================================
  # SIMULATED RESTOCK TEST
  # ============================================================

  simulate-restock:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_restock }}
    runs-on: ubuntu-latest

    steps:
      - name: Restore Best Buy dedupe test state
        uses: actions/cache/restore@v4
        with:
          path: .bestbuy-dedupe-state.json
          key: bestbuy-dedupe-state-${{ github.run_id }}
          restore-keys: |
            bestbuy-dedupe-state-

      - name: Simulate Best Buy restock
        run: |
          node <<'EOF'

          const fs = require("fs");

          const STATE_FILE =
            ".bestbuy-dedupe-state.json";

          const NTFY_TOPIC =
            "joshpokemon6685563";

          const PRODUCT = {
            name:
              "Pokémon TCG 30th Celebration Ultra-Premium Collection",

            sku:
              "6685563",

            url:
              "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254"
          };


          function loadState() {

            try {

              if (!fs.existsSync(STATE_FILE)) {
                return {};
              }

              return JSON.parse(
                fs.readFileSync(
                  STATE_FILE,
                  "utf8"
                )
              );

            } catch (_) {

              return {};
            }
          }


          async function sendNotification() {

            const response =
              await fetch(
                `https://ntfy.sh/${NTFY_TOPIC}`,
                {
                  method: "POST",

                  headers: {
                    "Title":
                      "SIMULATED BEST BUY RESTOCK",

                    "Priority":
                      "urgent",

                    "Tags":
                      "test_tube,pokemon",

                    "Click":
                      PRODUCT.url
                  },

                  body:
                    `SIMULATION ONLY\n\n` +
                    `${PRODUCT.name}\n\n` +
                    `SKU ${PRODUCT.sku}`
                }
              );


            if (!response.ok) {

              throw new Error(
                `Notification failed: ${response.status}`
              );
            }
          }


          (async () => {

            const state =
              loadState();

            const wasAvailable =
              state[PRODUCT.sku] === true;


            if (!wasAvailable) {

              console.log(
                "🔔 First simulated restock."
              );

              await sendNotification();

              state[PRODUCT.sku] =
                true;

              console.log(
                "✅ FIRST SIMULATED RESTOCK RECORDED"
              );

            } else {

              console.log(
                "🔕 Duplicate notification suppressed."
              );

              console.log(
                "✅ DEDUPE TEST PASSED"
              );
            }


            fs.writeFileSync(
              STATE_FILE,
              JSON.stringify(
                state,
                null,
                2
              )
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF


      - name: Save Best Buy dedupe test state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bestbuy-dedupe-state.json
          key: bestbuy-dedupe-state-${{ github.run_id }}


  # ============================================================
  # LIVE AGGRESSIVE BEST BUY WATCH
  # ============================================================

  check-bestbuy:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.test_alert && !inputs.simulate_restock) }}

    runs-on: ubuntu-latest

    timeout-minutes: 7


    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # RESTORE STOCK STATE
      # ----------------------------------------------------------

      - name: Restore previous Best Buy stock state
        uses: actions/cache/restore@v4

        with:
          path: .bestbuy-stock-state.json

          key: bestbuy-stock-state-${{ github.run_id }}

          restore-keys: |
            bestbuy-stock-state-


      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20


      # ----------------------------------------------------------
      # PLAYWRIGHT
      # ----------------------------------------------------------

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium


      # ----------------------------------------------------------
      # AGGRESSIVE MONITOR
      #
      # GitHub starts us every 5 minutes.
      #
      # During each run we perform FOUR checks:
      #
      # CHECK 1
      # wait 50 sec
      # CHECK 2
      # wait 50 sec
      # CHECK 3
      # wait 50 sec
      # CHECK 4
      #
      # ----------------------------------------------------------

      - name: Aggressive Best Buy Pokémon watch
        run: |

          cat > check-bestbuy.js <<'EOF'

          const {
            chromium
          } = require(
            "playwright"
          );

          const fs =
            require(
              "fs"
            );


          // ======================================================
          // SETTINGS
          // ======================================================

          const STATE_FILE =
            ".bestbuy-stock-state.json";

          const NTFY_TOPIC =
            "joshpokemon6685563";


          const CHECKS_PER_RUN =
            4;


          const CHECK_DELAY_MS =
            50000;


          const PRODUCT = {

            name:
              "Pokémon TCG 30th Celebration Ultra-Premium Collection",

            sku:
              "6685563",

            url:
              "https://www.bestbuy.com/product/pokemon-trading-card-game-30th-celebration-ultra-premium-collection-day-or-night-1-ultra-premium-collection-per-order-styles-may-vary/JJG2TL8254",

            requiredWords: [

              "30th celebration",

              "ultra-premium collection",

              "6685563"

            ]
          };


          // ======================================================
          // HELPERS
          // ======================================================

          function sleep(ms) {

            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  ms
                )
            );
          }


          function loadState() {

            try {

              if (
                !fs.existsSync(
                  STATE_FILE
                )
              ) {

                console.log(
                  "No previous Best Buy stock state found."
                );

                return {};
              }


              const state =
                JSON.parse(
                  fs.readFileSync(
                    STATE_FILE,
                    "utf8"
                  )
                );


              console.log(
                "✅ Previous Best Buy stock state loaded."
              );


              return state;


            } catch (error) {

              console.log(
                "⚠️ Could not read previous Best Buy state."
              );

              return {};
            }
          }


          function saveState(state) {

            fs.writeFileSync(
              STATE_FILE,

              JSON.stringify(
                state,
                null,
                2
              )
            );
          }


          // ======================================================
          // NOTIFICATION
          // ======================================================

          async function sendNotification() {

            const response =
              await fetch(
                `https://ntfy.sh/${NTFY_TOPIC}`,

                {
                  method:
                    "POST",

                  headers: {

                    "Title":
                      "BEST BUY POKEMON RESTOCK",

                    "Priority":
                      "urgent",

                    "Tags":
                      "rotating_light,pokemon",

                    "Click":
                      PRODUCT.url
                  },

                  body:

                    `${PRODUCT.name} may be available at Best Buy!\n\n` +

                    `SKU ${PRODUCT.sku}\n\n` +

                    `Tap this notification to open Best Buy.`
                }
              );


            console.log(
              `Notification status: ${response.status}`
            );


            if (!response.ok) {

              throw new Error(
                `Notification failed with HTTP ${response.status}`
              );
            }
          }


          // ======================================================
          // CHECK BEST BUY
          // ======================================================

          async function inspectProduct(
            page
          ) {

            const response =
              await page.goto(
                PRODUCT.url,

                {
                  waitUntil:
                    "domcontentloaded",

                  timeout:
                    60000
                }
              );


            console.log(
              `HTTP status: ${
                response
                  ? response.status()
                  : "unknown"
              }`
            );


            // Give Best Buy time to render.
            await page.waitForTimeout(
              6000
            );


            const bodyText =
              await page
                .locator(
                  "body"
                )
                .innerText()
                .catch(
                  () => ""
                );


            const lower =
              bodyText.toLowerCase();


            // ==================================================
            // BOT / CHALLENGE PROTECTION
            // ==================================================

            const blockedWords = [

              "access denied",

              "verify you are human",

              "captcha",

              "automated access",

              "robot",

              "unusual traffic"

            ];


            const blocked =
              blockedWords.some(
                word =>
                  lower.includes(
                    word
                  )
              );


            if (blocked) {

              console.log(
                "⚠️ Best Buy returned a blocked/challenge page."
              );

              console.log(
                "State unchanged."
              );


              return {

                trusted:
                  false,

                available:
                  null
              };
            }


            // ==================================================
            // PRODUCT SAFETY LOCK
            // ==================================================

            const productVerified =
              PRODUCT.requiredWords.every(
                word =>
                  lower.includes(
                    word.toLowerCase()
                  )
              );


            if (!productVerified) {

              console.log(
                "🔒 Product identity verification failed."
              );

              console.log(
                "State unchanged."
              );


              return {

                trusted:
                  false,

                available:
                  null
              };
            }


            console.log(
              "✅ Product identity verified."
            );


            // ==================================================
            // COMING SOON
            // ==================================================

            const comingSoon =
              lower.includes(
                "coming soon"
              );


            // ==================================================
            // FIND PURCHASE CONTROLS
            // ==================================================

            const buttons =
              page.locator(
                "button, [role='button']"
              );


            const count =
              await buttons.count();


            const purchaseButtons =
              [];


            for (
              let i = 0;
              i < count;
              i++
            ) {

              const button =
                buttons.nth(i);


              try {

                if (
                  !(await button.isVisible())
                ) {

                  continue;
                }


                if (
                  !(await button.isEnabled())
                ) {

                  continue;
                }


                const text =
                  (
                    await button
                      .innerText()
                      .catch(
                        () => ""
                      )
                  )
                    .trim()
                    .replace(
                      /\s+/g,
                      " "
                    )
                    .toLowerCase();


                const purchaseText =

                  text ===
                    "add to cart" ||

                  text ===
                    "pre-order" ||

                  text ===
                    "preorder";


                if (!purchaseText) {

                  continue;
                }


                const box =
                  await button
                    .boundingBox();


                if (!box) {

                  continue;
                }


                // Ignore small recommendation/product buttons.
                if (
                  box.width < 250 ||
                  box.height < 35
                ) {

                  continue;
                }


                purchaseButtons.push(
                  text
                );


              } catch (_) {}
            }


            console.log(
              `Coming Soon: ${comingSoon}`
            );


            console.log(
              `Large purchase controls: ${purchaseButtons.length}`
            );


            for (
              const text
              of purchaseButtons
            ) {

              console.log(
                `🟢 Purchase control found: ${text}`
              );
            }


            // ==================================================
            // AVAILABILITY
            // ==================================================

            const available =

              !comingSoon &&

              purchaseButtons.length >= 1;


            return {

              trusted:
                true,

              available:
                available
            };
          }


          // ======================================================
          // MAIN
          // ======================================================

          (async () => {

            console.log(
              "========================================"
            );

            console.log(
              "BEST BUY POKÉMON AGGRESSIVE CLOUD WATCH"
            );

            console.log(
              "========================================"
            );


            const stockState =
              loadState();


            const browser =
              await chromium.launch({

                headless:
                  true

              });


            const context =
              await browser.newContext({

                userAgent:

                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) " +

                  "AppleWebKit/605.1.15 (KHTML, like Gecko) " +

                  "Version/18.0 Mobile/15E148 Safari/604.1",

                viewport: {

                  width:
                    390,

                  height:
                    844
                },

                locale:
                  "en-US"
              });


            const page =
              await context.newPage();


            try {

              // ==================================================
              // MULTIPLE CHECKS PER GITHUB RUN
              // ==================================================

              for (

                let check = 1;

                check <=
                  CHECKS_PER_RUN;

                check++

              ) {

                console.log(
                  ""
                );


                console.log(
                  `========== CHECK ${check}/${CHECKS_PER_RUN} ==========`
                );


                const result =
                  await inspectProduct(
                    page
                  );


                if (
                  result.trusted
                ) {

                  const wasAvailable =

                    stockState[
                      PRODUCT.sku
                    ] === true;


                  // ==============================================
                  // AVAILABLE
                  // ==============================================

                  if (
                    result.available
                  ) {

                    console.log(
                      `🚨 AVAILABLE: ${PRODUCT.name}`
                    );


                    if (
                      !wasAvailable
                    ) {

                      console.log(
                        "🔔 New availability detected — sending notification."
                      );


                      await sendNotification();


                    } else {

                      console.log(
                        "🔕 Already alerted for this availability window."
                      );
                    }


                    stockState[
                      PRODUCT.sku
                    ] =
                      true;


                  // ==============================================
                  // NOT AVAILABLE
                  // ==============================================

                  } else {

                    console.log(
                      "🟡 Not currently available."
                    );


                    stockState[
                      PRODUCT.sku
                    ] =
                      false;
                  }


                  saveState(
                    stockState
                  );
                }


                // ================================================
                // WAIT BEFORE NEXT INTERNAL CHECK
                // ================================================

                if (
                  check <
                  CHECKS_PER_RUN
                ) {

                  console.log(
                    `Waiting ${
                      CHECK_DELAY_MS / 1000
                    } seconds before next check...`
                  );


                  await sleep(
                    CHECK_DELAY_MS
                  );
                }
              }


            } finally {

              await browser.close();


              saveState(
                stockState
              );
            }


            console.log(
              "========================================"
            );

            console.log(
              "✅ Aggressive Best Buy watch run finished."
            );

            console.log(
              "========================================"
            );


          })().catch(
            error => {

              console.error(
                error
              );

              process.exit(
                1
              );
            }
          );

          EOF


          node check-bestbuy.js


      # ----------------------------------------------------------
      # SAVE STOCK STATE
      # ----------------------------------------------------------

      - name: Save Best Buy stock state
        if: always()

        uses: actions/cache/save@v4

        with:
          path: .bestbuy-stock-state.json

          key: bestbuy-stock-state-${{ github.run_id }}